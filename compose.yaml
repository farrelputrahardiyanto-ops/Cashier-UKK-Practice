services:
  app:
    build:
      context: .
    volumes:
      - ./:/var/www/html

  
  nginx:
    image: nginx:1.30.4
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

  
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ukk2
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: 
